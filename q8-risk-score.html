<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Questionnaire Q8</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body class="q8-body">

  <div class="q-screen">
    <div class="q-bg-gradient"></div>
    <div class="q-bg-illustration"></div>

    <header class="q-header">
      <div class="q-top-bar">
        <button class="q-back-btn" onclick="location.href='q7-risk-score.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="q-title-group">
          <h1>Gestosis Risk Score</h1>
          <p>Assessing your preeclampsia risk level</p>
        </div>
      </div>

      <div class="q-progress-section">
        <span class="q-step-label">STEP 8 OF 12</span>
        <div class="q-progress-track">
          <div class="q-progress-fill" style="width: 66.66%;"></div>
        </div>
      </div>
    </header>

    <main class="q-main">
      <div class="q-card">
        <div class="q-card-header">
          <div class="q-badge">
            <span class="q-badge-text">Q8 OF 12</span>
            <div class="q-badge-line"></div>
          </div>
        </div>

        <h2 class="q-question">BP at your first antenatal visit?</h2>

        <div class="q-input-container" style="margin-bottom:12px;">
          <input type="number" placeholder="000" id="q8-systolic" min="70" max="250">
          <span class="q-input-unit">Systolic</span>
        </div>

        <div class="q-input-container">
          <input type="number" placeholder="00" id="q8-diastolic" min="40" max="150">
          <span class="q-input-unit">Diastolic</span>
        </div>

        <div class="q-helper-box">
          <div class="icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#80543B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </div>
          <p>Your booking BP sets the clinical baseline. Normal is typically below 130/80 mmHg.</p>
        </div>
      </div>

      <div class="q-actions">
        <button id="q8-next-btn" class="q-btn-primary" disabled onclick="location.href='q9-risk-score.html'">Next</button>
        <button class="q-btn-secondary" onclick="location.href='dashboard.html'">Save and Exit</button>
      </div>
    </main>
  </div>

<script src='script.js'></script>
<script>
  const sInp = document.getElementById('q8-systolic');
  const dInp = document.getElementById('q8-diastolic');
  const btn = document.getElementById('q8-next-btn');

  function validate() {
    const s = parseInt(sInp.value);
    const d = parseInt(dInp.value);
    const valid = s >= 70 && s <= 250 && d >= 40 && d <= 150;
    btn.disabled = !valid;
    if (valid) {
      const a = GG.get('gg_q_answers', {});
      a.q8_sys = s;
      a.q8_dia = d;
      GG.set('gg_q_answers', a);
    }
  }
  sInp.addEventListener('input', validate);
  dInp.addEventListener('input', validate);
</script>v>

<script src='script.js'></script></body>
</html>
