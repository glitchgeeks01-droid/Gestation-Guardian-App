<!-- pages/signin.html -->
<div id="page-signin" class="page">
    <div class="signin-bg" style="background-image: url('/login-bg.png');"></div>
    
    <div class="signin-content">
        <!-- Branding Header -->
        <div class="brand-header">
            <!-- Use a placeholder div for logo if image not available -->
            <div style="width: 72px; height: 72px; background: var(--clr-primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 12px;">
                <i data-lucide="shield" style="color: white; width: 36px; height: 36px;"></i>
            </div>
            <h1 style="color: #123326; font-weight: 800; font-size: 24px;">Gestation Guardian</h1>
            <p style="font-weight: 600; font-size: 14px; color: #234E3B; margin-top: 4px;">Monitor. Protect. Nurture.</p>
        </div>

        <!-- Glass Card for Auth -->
        <div class="card-glass w-full" style="padding: 28px 20px;">
            
            <!-- Tab Switcher (Simulated links for SPA) -->
            <div class="tab-switcher mb-4" style="margin-bottom: 24px;">
                <a href="#/signin" class="tab-btn active">Sign In</a>
                <a href="#/signup" class="tab-btn">Sign Up</a>
            </div>

            <form id="form-signin" data-action="signin-submit">
                <!-- Form Fields Container -->
                <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px;">
                    
                    <!-- Email Field -->
                    <div class="input-group">
                        <div class="label-row">
                            <label class="label">Email Address</label>
                        </div>
                        <div style="position: relative; width: 100%;">
                            <i data-lucide="mail" class="input-icon-left"></i>
                            <input type="email" id="signin-email" class="input-auth" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <div class="label-row">
                            <label class="label">Password</label>
                            <a href="#/forgot-password" class="btn-text-link">Forgot?</a>
                        </div>
                        <div style="position: relative; width: 100%;">
                            <i data-lucide="lock" class="input-icon-left"></i>
                            <input type="password" id="signin-password" class="input-auth" placeholder="••••••••" required>
                            <button type="button" class="input-icon-right" data-action="toggle-password" data-target="signin-password" aria-label="Toggle password visibility">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="submit" class="btn btn-action" style="margin-top: 8px;">
                    Sign In
                </button>
            </form>

            <div class="divider-with-text mt-4 mb-4" style="margin: 22px 0;">
                <span>OR</span>
            </div>

            <!-- Social Sign-in -->
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button type="button" class="btn btn-google" data-action="social-login-notice">
                    <i data-lucide="chrome" style="color: #4285F4;"></i>
                    Continue with Google
                </button>
                <button type="button" class="btn btn-apple" data-action="social-login-notice">
                    <i data-lucide="apple"></i>
                    Continue with Apple
                </button>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 18px; background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(8px); border-radius: 16px; padding: 10px 16px;">
            <p style="font-weight: 700; font-size: 14px; color: var(--clr-text-primary); margin: 0;">
                Don't have an account? <a href="#/signup" style="color: var(--clr-primary); font-weight: 800; text-decoration: underline;">Create one</a>
            </p>
        </div>
    </div>
</div>
