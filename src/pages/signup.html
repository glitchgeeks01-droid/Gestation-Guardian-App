<!-- pages/signup.html -->
<div id="page-signup" class="page">
    <div class="signup-bg" style="background-image: url('./signup-bg.png');"></div>
    
    <div class="signup-content">
        <!-- Solid White Card -->
        <div class="card-white w-full" style="padding: 24px 20px; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5);">
            
            <div class="signup-header">
                <!-- Placeholder for logo -->
                <div style="width: 64px; height: 64px; background: var(--clr-primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 8px;">
                    <i data-lucide="shield" style="color: white; width: 32px; height: 32px;"></i>
                </div>
                <h2 style="font-size: 24px;">Create Your<br>Safe Space</h2>
                <p style="font-weight: 500; font-size: 14px; color: var(--clr-text-body); margin-top: 6px;">Let's get started on your journey</p>
            </div>

            <!-- Tab Switcher (Simulated links for SPA) -->
            <div class="tab-switcher mb-4" style="margin-bottom: 16px;">
                <a href="#/signin" class="tab-btn">Sign In</a>
                <a href="#/signup" class="tab-btn active">Sign Up</a>
            </div>

            <form id="form-signup" class="signup-form" data-action="signup-submit">
                
                <!-- Full Name -->
                <div class="input-group">
                    <label class="label">Full Name</label>
                    <div style="position: relative;">
                        <input type="text" id="su-name" name="name" class="input-form" placeholder="Full Name (e.g. Eleanor Vance)" style="padding-right: 48px;" required>
                        <i data-lucide="user" class="input-icon-right" style="pointer-events: none;"></i>
                    </div>
                </div>

                <!-- Phone & OTP Section -->
                <div class="input-group">
                    <label class="label">Phone Number</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="tel" id="su-phone" name="phone" class="input-form" style="flex: 1;" placeholder="+91 98765 43210" required>
                        <button type="button" class="btn btn-primary" style="width: auto; padding: 0 24px; height: 58px; font-size: 14px;" data-action="send-otp" aria-label="Send OTP">Send</button>
                    </div>
                </div>

                <div id="otp-section" class="input-group hidden">
                    <label class="label">Enter OTP</label>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <input type="text" id="su-otp" name="otp" class="input-form" placeholder="Enter 4-digit OTP" maxlength="4" style="letter-spacing: 6px; font-size: 18px; font-weight: 700; text-align: center;">
                        <div class="otp-group" style="display: none;">
                            <input type="text" maxlength="1" class="input-otp" inputmode="numeric" pattern="[0-9]*" data-index="1">
                            <input type="text" maxlength="1" class="input-otp" inputmode="numeric" pattern="[0-9]*" data-index="2">
                            <input type="text" maxlength="1" class="input-otp" inputmode="numeric" pattern="[0-9]*" data-index="3">
                            <input type="text" maxlength="1" class="input-otp" inputmode="numeric" pattern="[0-9]*" data-index="4">
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label class="label">Email</label>
                    <input type="email" id="su-email" name="email" class="input-form" placeholder="name@example.com" required>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label class="label">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="su-password" name="password" class="input-form" placeholder="At least 6 characters" minlength="6" style="padding-right: 48px;" required>
                        <button type="button" class="input-icon-right" data-action="toggle-password" data-target="su-password" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Date of Birth & Age -->
                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="label">Date of Birth & Age</label>
                        <span id="su-age-display" style="font-size: 12px; color: var(--clr-primary); font-weight: 600;"></span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <input type="date" id="su-dob" name="dob" class="input-form" style="flex: 2;">
                        <input type="number" id="su-age" name="age" class="input-form" placeholder="Age" min="15" max="60" style="flex: 1;" title="Age in years">
                    </div>
                </div>

                <!-- LMP & Gestational Weeks -->
                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="label">Last Menstrual Period (LMP) & Week</label>
                        <span id="su-weeks-display" style="font-size: 12px; color: var(--clr-primary); font-weight: 600;"></span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <input type="date" id="su-lmp" name="lmp" class="input-form" data-action="calculate-edd" style="flex: 2;">
                        <input type="number" id="su-weeks" name="gestationalWeeks" class="input-form" placeholder="Week" min="1" max="42" style="flex: 1;" title="Gestational Week">
                    </div>
                    <p id="su-edd-display" style="font-size: 12px; color: var(--clr-text-muted); margin-top: 4px;"></p>
                </div>

                <!-- Blood Group -->
                <div class="input-group">
                    <label class="label">Blood Group</label>
                    <select id="su-blood" name="bloodGroup" class="input-form">
                        <option value="" disabled>Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+" selected>O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-action" style="margin-top: 16px;">
                    Continue to Health Profile
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 14px;">
                <p style="font-size: 14px; color: var(--clr-text-muted);">
                    Already have an account? <a href="#/signin" style="color: var(--clr-primary); font-weight: 700;">Sign In</a>
                </p>
            </div>
            
        </div>
    </div>
</div>
