<!-- pages/bluetooth.html -->
<div id="page-bluetooth" class="page">
    
    <!-- Top Glass Header -->
    <header class="glass-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="#" data-action="back" style="width: 20px; height: 20px; color: var(--clr-dark-green);">
                <i data-lucide="arrow-left"></i>
            </a>
            <h1 style="font-size: 20px; color: var(--clr-dark-green);">Connect Devices</h1>
        </div>
        
        <a href="#/dashboard" style="width: 40px; height: 40px; background: var(--clr-border-input); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--clr-text-muted);">
            <i data-lucide="x"></i>
        </a>
    </header>

    <div class="bt-main">
        
        <!-- Hero Section with Scanning Animation -->
        <div class="bt-hero" style="margin-bottom: 24px;">
            <div class="scanning-animation">
                <div class="scan-ring"></div>
                <div class="scan-ring"></div>
                <div class="scan-ring"></div>
                <div class="scan-center" style="background: var(--clr-primary);">
                    <i data-lucide="bluetooth" class="scan-center-icon" style="color: white;"></i>
                </div>
            </div>
            
            <h2 class="mt-4">Device Sync</h2>
            <p style="font-size: 16px; color: var(--clr-text-muted-alt); text-align: center; margin-top: 8px;">
                Real-time vitals for a safer journey.
            </p>
        </div>

        <!-- Device List -->
        <div class="bt-device-list">
            
            <!-- BP Monitor -->
            <div class="card-device" style="border: 2px solid var(--clr-primary); background: var(--clr-primary-10);">
                <div class="card-device-icon-bg green" style="background: white; color: var(--clr-primary);">
                    <i data-lucide="heart-pulse"></i>
                </div>
                <div class="card-device-content">
                    <h3 style="color: var(--clr-primary); font-weight: 700;">Clinical BP Monitor</h3>
                    <p style="font-size: 12px;">Omron, iHealth, Withings</p>
                </div>
                <button class="btn btn-connect" data-action="bt-connect" data-device="bp-monitor" aria-label="Connect BP Monitor" style="background: var(--clr-primary); color: white; border: none;">Connect</button>
            </div>

            <!-- Smartwatch -->
            <div class="card-device">
                <div class="card-device-icon-bg purple">
                    <i data-lucide="watch"></i>
                </div>
                <div class="card-device-content">
                    <h3 style="font-weight: 700;">Smartwatch (HR)</h3>
                    <p style="font-size: 12px;">Apple Watch, Fitbit, Garmin</p>
                </div>
                <button class="btn btn-connect" data-action="bt-connect" data-device="smartwatch" aria-label="Connect Smartwatch">Connect</button>
            </div>
            
        </div>

        <!-- Clinical Relevance Info -->
        <div style="text-align: center; padding: 24px 16px;">
            <p style="font-size: 13px; color: var(--clr-text-muted); line-height: 1.5; background: rgba(0,0,0,0.03); padding: 12px; border-radius: 12px;">
                <i data-lucide="shield-check" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle; margin-right: 4px; margin-top: -2px; color: var(--clr-primary);"></i>
                Syncing a clinical Blood Pressure monitor enables early detection of Gestational Hypertension and Preeclampsia.
            </p>
        </div>

    </div>

</div>
