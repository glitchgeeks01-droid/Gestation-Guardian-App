<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Questionnaire Q11</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body class="q11-body">

  <div class="q-screen">
    <div class="q-bg-gradient"></div>
    <div class="q-bg-illustration"></div>

    <header class="q-header">
      <div class="q-top-bar">
        <button class="q-back-btn" onclick="location.href='q10-risk-score.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="q-title-group">
          <h1>Gestosis Risk Score</h1>
          <p>Assessing your preeclampsia risk level</p>
        </div>
      </div>

      <div class="q-progress-section">
        <span class="q-step-label">STEP 11 OF 12</span>
        <div class="q-progress-track">
          <div class="q-progress-fill" style="width: 91.66%;"></div>
        </div>
      </div>
    </header>

    <main class="q-main">
      <div class="q-card">
        <div class="q-card-header">
          <div class="q-badge">
            <span class="q-badge-text">Q11 OF 12</span>
            <div class="q-badge-line"></div>
          </div>
        </div>

        <h2 class="q-question">Weight gained in the past 7 days?</h2>

        <div class="q-choice-list">
          <label class="q-choice-item">
            <input type="radio" name="q11" value="less1">
            <div class="q-choice-content">
              <div class="q-choice-radio"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">Less than 1 kg</span>
                <span class="q-choice-points">0 pts added</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="radio" name="q11" value="1-2">
            <div class="q-choice-content">
              <div class="q-choice-radio"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">1–2 kg</span>
                <span class="q-choice-points">0 pts added</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="radio" name="q11" value="more2" checked>
            <div class="q-choice-content">
              <div class="q-choice-radio"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">More than 2 kg</span>
                <span class="q-choice-points">+1 pt clinical warning</span>
              </div>
            </div>
          </label>
        </div>

        <div class="q-helper-box">
          <div class="icon">
             <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
             </svg>
          </div>
          <p>Sudden weight gain often indicates fluid retention, a common silent symptom.</p>
        </div>
      </div>

      <div class="q-actions">
        <button id="q11-next-btn" class="q-btn-primary" onclick="location.href='q12-risk-score.html'">Next</button>
        <button class="q-btn-secondary" onclick="location.href='dashboard.html'">Save and Exit</button>
      </div>
    </main>
  </div>

<script src='script.js'></script></body>
</html>
