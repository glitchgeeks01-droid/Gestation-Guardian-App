<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Questionnaire Q12</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-skeuomorphic.css">
  <meta name="theme-color" content="#FAF9F6">
</head>
<body class="q12-body">

  <div class="q-screen">
    <div class="q-bg-gradient"></div>
    <div class="q-bg-illustration"></div>

    <header class="q-header">
      <div class="q-top-bar">
        <button class="q-back-btn" onclick="location.href='q11-risk-score.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="q-title-group">
          <h1>Gestosis Risk Score</h1>
          <p>Assessing your preeclampsia risk level</p>
        </div>
      </div>

      <div class="q-progress-section">
        <span class="q-step-label">STEP 12 OF 12</span>
        <div class="q-progress-track">
          <div class="q-progress-fill" style="width: 100%;"></div>
        </div>
      </div>
    </header>

    <main class="q-main">
      <div class="q-card">
        <div class="q-card-header">
          <div class="q-badge">
            <span class="q-badge-text">Q12 OF 12</span>
            <div class="q-badge-line"></div>
          </div>
        </div>

        <h2 class="q-question">Recent urine dipstick protein result?</h2>

        <div class="q-choice-list">
          <label class="q-choice-item">
            <input type="radio" name="q12" value="negative">
            <div class="q-choice-content">
              <div class="q-choice-radio"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">Negative</span>
                <span class="q-choice-points">0 pts added</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="radio" name="q12" value="trace">
            <div class="q-choice-content">
              <div class="q-choice-radio"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">Trace Protein</span>
                <span class="q-choice-points">0 pts added</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="radio" name="q12" value="1plus">
            <div class="q-choice-content">
              <div class="q-choice-radio"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">1+ Protein</span>
                <span class="q-choice-points">+1 pt clinical factor</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="radio" name="q12" value="2plus">
            <div class="q-choice-content">
              <div class="q-choice-radio"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">2+ Protein</span>
                <span class="q-choice-points">+1 pt clinical factor</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="radio" name="q12" value="3plus">
            <div class="q-choice-content">
              <div class="q-choice-radio"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">3++ Protein</span>
                <span class="q-choice-points">+1 pt clinical factor</span>
              </div>
            </div>
          </label>
        </div>

        <div class="q-helper-box">
          <div class="icon"></div>
          <p>Proteinuria is a key indicator of kidney stress and preeclampsia severity when combined with high BP.</p>
        </div>
      </div>

      <div class="q-actions">
        <button id="q12-finish-btn" class="q-btn-primary" onclick="location.href='assessment-report.html'">Complete & See Results</button>
        <button class="q-btn-secondary" onclick="location.href='assessment-report.html'">Skip Test</button>
      </div>
    </main>
  </div>

<script src='script.js'></script></body>
