<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Health Reminders</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body class="reminders-body">

  <div class="reminders-screen">
    
    <!-- Top App Bar -->
    <header class="reminders-header">
      <button class="icon-btn" onclick="location.href='dashboard.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1 class="header-title-reminders">Health Reminders</h1>
    </header>

    <!-- Scrollable Main Content -->
    <main class="reminders-main">
      
      <!-- Hero / Add Reminder CTA -->
      <section class="hero-cta-card">
        <h2 class="hero-title">Organize your wellness routine</h2>
        <button class="btn-add-reminder">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <polyline x1="5" y1="12" x2="19" y2="12"></polyline>
          </svg>
          Add Reminder
        </button>
      </section>

      <!-- Active Schedules Section -->
      <section class="schedules-section">
        
        <div class="section-header">
          <h3 class="section-title-reminders">ACTIVE SCHEDULES</h3>
          <button class="btn-text-edit" id="btn-clear-reminders">Edit all</button>
        </div>

        <div id="reminders-list">
          <!-- Dynamic cards injected here -->
        </div>

      </section>

      <!-- Illustration Area -->
      <div class="illustration-area">
        <img src="maternal_line_art_reminders_1777742556313.png" alt="Maternal Illustration" class="maternal-art">
      </div>

    </main>

    <!-- Add Reminder Modal (Enhanced Style) -->
    <div id="add-reminder-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);backdrop-filter:blur(12px);z-index:100;align-items:center;justify-content:center;padding:20px;">
      <div style="background:#FAF9F6;padding:32px;border-radius:48px;width:100%;max-width:340px;box-shadow:0 12px 48px rgba(0,0,0,0.15);">
        <h3 style="margin:0 0 20px;color:#1A1C1A;font-size:20px;font-family:'Lexend';font-weight:600;">New Reminder</h3>
        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:12px;font-weight:700;color:#5F645F;margin-bottom:8px;letter-spacing:1px;">LABEL</label>
          <input type="text" id="new-reminder-title" placeholder="e.g. Vitamins" style="width:100%;padding:16px;border-radius:16px;border:1px solid rgba(0,0,0,0.05);background:#FFFFFF;font-family:'Lexend';">
        </div>
        <div style="margin-bottom:32px;">
          <label style="display:block;font-size:12px;font-weight:700;color:#5F645F;margin-bottom:8px;letter-spacing:1px;">TIME</label>
          <input type="time" id="new-reminder-time" style="width:100%;padding:16px;border-radius:16px;border:1px solid rgba(0,0,0,0.05);background:#FFFFFF;font-family:'Lexend';">
        </div>
        <div style="display:flex;gap:12px;">
          <button id="btn-cancel-reminder" style="flex:1;padding:16px;border-radius:9999px;background:rgba(0,0,0,0.05);color:#424841;font-weight:600;border:none;cursor:pointer;font-family:'Lexend';">Cancel</button>
          <button id="btn-save-reminder" style="flex:1;padding:16px;border-radius:9999px;background:#436746;color:#fff;font-weight:600;border:none;cursor:pointer;font-family:'Lexend';">Save</button>
        </div>
      </div>
    </div>

  </div>

<script src='script.js'></script></body>
</html>
