<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Log Blood Pressure</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body class="log-bp-body">

  <div class="log-bp-screen">
    
    <!-- Top App Bar -->
    <header class="app-header">
      <button class="icon-btn back-btn" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1 class="header-title">Log Blood Pressure</h1>
      <!-- Invisible spacer to perfectly center the title -->
      <div style="width: 24px;"></div>
    </header>

    <!-- Scrollable Main Content -->
    <main class="log-bp-main">
      
      <!-- Helpful Guidance Note -->
      <section class="guidance-card">
        <div class="guidance-content">
          <div class="icon-circle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
              <line x1="12" y1="2" x2="12" y2="4"></line>
            </svg>
          </div>
          <div class="guidance-text">
            <h3>A Moment of Stillness</h3>
            <p>For the most accurate results, please rest in a seated position for at least 5 minutes before taking your measurement.</p>
          </div>
        </div>
        <div class="decorative-blur"></div>
      </section>

      <!-- Blood Pressure Inputs -->
      <section class="reading-inputs">
        <div class="input-group">
          <label>Systolic</label>
          <div class="bp-input-wrapper">
            <input type="number" placeholder="120">
            <span class="unit-label">MMHG</span>
          </div>
        </div>
        <div class="input-group">
          <label>Diastolic</label>
          <div class="bp-input-wrapper">
            <input type="number" placeholder="80">
            <span class="unit-label">MMHG</span>
          </div>
        </div>
      </section>

      <!-- Date & Time Row -->
      <section class="datetime-inputs">
        <div class="input-group">
          <label>Date</label>
          <div class="dt-input-wrapper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <input type="text" value="Oct 24, 2023" readonly>
          </div>
        </div>
        <div class="input-group">
          <label>Time</label>
          <div class="dt-input-wrapper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <input type="text" value="09:45 AM" readonly>
          </div>
        </div>
      </section>

      <!-- Body Position Selection -->
      <section class="position-section">
        <label class="section-label">Body Position</label>
        <div class="position-grid">
          
          <label class="position-card">
            <input type="radio" name="body_position" value="sitting" checked>
            <div class="card-content">
              <div class="icon-bg">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 19v-6h6V5a2 2 0 0 1 2-2h2"></path>
                  <circle cx="13" cy="5" r="2"></circle>
                  <path d="M11 13h4v6"></path>
                  <path d="M15 13l4-4"></path>
                </svg>
              </div>
              <span>Sitting</span>
            </div>
          </label>

          <label class="position-card">
            <input type="radio" name="body_position" value="standing">
            <div class="card-content">
              <div class="icon-bg">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="5" r="2"></circle>
                  <path d="M12 7v8"></path>
                  <path d="M8 11l4-4 4 4"></path>
                  <path d="M12 15l-4 6"></path>
                  <path d="M12 15l4 6"></path>
                </svg>
              </div>
              <span>Standing</span>
            </div>
          </label>

          <label class="position-card">
            <input type="radio" name="body_position" value="lying">
            <div class="card-content">
              <div class="icon-bg">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 14h20"></path>
                  <path d="M4 14v4"></path>
                  <path d="M20 14v4"></path>
                  <path d="M6 10v4"></path>
                  <path d="M18 10v4"></path>
                  <circle cx="9" cy="10" r="2"></circle>
                </svg>
              </div>
              <span>Lying Down</span>
            </div>
          </label>

        </div>
      </section>

      <!-- Visual Context Illustration -->
      <section class="visual-context">
        <div class="illustration-wrapper">
          <!-- Placeholder maternal image from Unsplash to bring it to life -->
          <img src="https://images.unsplash.com/photo-1558066514-469b61dbd178?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Maternal relaxation">
          <div class="gradient-overlay"></div>
        </div>
      </section>

    </main>

    <!-- Fixed Footer Action -->
    <footer class="fixed-footer">
      <button class="btn-save">Save Reading</button>
    </footer>

  </div>

<script src='script.js'></script></body>
</html>
