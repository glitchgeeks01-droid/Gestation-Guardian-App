<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Create Account</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-skeuomorphic.css">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="stylesheet" href="mobile-patch.css">
  <link rel="stylesheet" href="figma-theme.css">
</head>
<body class="signup-body">

  <div class="signup-wrapper">
    <div class="signup-card">
      
      <!-- Header -->
      <header class="signup-header">
        <h1 class="title">Create your<br>account</h1>
        <p class="subtitle">Step into your sanctuary of wellness<br>and care.</p>
      </header>

      <!-- Form -->
      <form class="signup-form">
        
        <!-- Full Name -->
        <div class="input-group">
          <label class="input-label">Full Name</label>
          <div class="input-wrapper">
            <input type="text" placeholder="Eleanor Vance" required>
            <svg class="icon right-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E938E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>

        <!-- Phone & OTP Section -->
        <div class="phone-otp-card">
          <div class="input-group">
            <label class="input-label">Phone Number</label>
            <div class="phone-input-wrapper">
              <div class="country-code">+91</div>
              <input type="tel" placeholder="98765 43210" required>
            </div>
          </div>
          
          <div class="otp-actions">
            <button type="button" class="btn-send-otp">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              Send OTP
            </button>
            <span class="otp-timer">OTP expires in 2:00</span>
          </div>

          <div class="input-group otp-group">
            <label class="input-label">OTP Verification</label>
            <div class="otp-inputs">
              <input type="text" maxlength="1">
              <input type="text" maxlength="1">
              <input type="text" maxlength="1">
              <input type="text" maxlength="1">
              <input type="text" maxlength="1">
              <input type="text" maxlength="1">
            </div>
          </div>
        </div>

        <!-- Email Address -->
        <div class="input-group">
          <label class="input-label">Email Address</label>
          <div class="input-wrapper">
            <input type="email" placeholder="Email Address" required>
            <svg class="icon right-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E938E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label class="input-label">Password</label>
          <div class="input-wrapper">
            <input type="password" placeholder="••••••••" required>
            <svg class="icon right-icon pointer" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E938E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
          <label class="input-label">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" placeholder="••••••••" required>
          </div>
        </div>

        <!-- LMP Date Card -->
        <div class="date-card lmp-card">
          <label class="input-label lmp-label">LMP Date (Last Period)</label>
          <div class="input-wrapper">
            <input type="date" required>
            <svg class="icon right-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6DA171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
        </div>

        <!-- Expected Due Date Card -->
        <div class="date-card edd-card">
          <label class="input-label edd-label">Expected Due Date</label>
          <div class="input-wrapper">
            <input type="date" required>
            <svg class="icon right-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#915E41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <span class="auto-calc-text">Auto-calculated or set manually</span>
        </div>

        <!-- Action Section -->
        <div class="action-section">
          <button type="submit" class="btn-create" id="signup-submit-btn">Create Account</button>
          <p class="login-link">Already have an account? <a href="signin.html">Sign In</a></p>
        </div>

      </form>

      <!-- Footer Terms -->
      <div class="footer-terms">
        <p>By creating an account, you agree to our <strong>Terms<br>of Sanctuary</strong> and <strong>Privacy Compass</strong>.</p>
      </div>

    </div>
  </div>

<script src='script.js'></script></body>
</html>
