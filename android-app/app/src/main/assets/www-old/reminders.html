<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Health Reminders</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-skeuomorphic.css">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="stylesheet" href="mobile-patch.css">
  <link rel="stylesheet" href="figma-theme.css">
</head>
<body class="reminders-body">

  <div class="reminders-screen">
    
    <!-- Top App Bar -->
    <header class="reminders-header">
      <button class="icon-btn" onclick="location.href='dashboard.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1 class="header-title-reminders">Health Reminders</h1>
    </header>

    <!-- Scrollable Main Content -->
    <main class="reminders-main">
      
      <!-- Hero / Add Reminder CTA -->
      <section class="hero-cta-card">
        <h2 class="hero-title">Organize your wellness routine</h2>
        <button class="btn-add-reminder">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <polyline x1="5" y1="12" x2="19" y2="12"></polyline>
          </svg>
          Add Reminder
        </button>
      </section>

      <!-- Active Schedules Section -->
      <section class="schedules-section">
        
        <div class="section-header">
          <h3 class="section-title-reminders">ACTIVE SCHEDULES</h3>
          <button class="btn-text-edit" id="btn-clear-reminders">Edit all</button>
        </div>

        <div id="reminders-list">
          <!-- Dynamic cards injected here -->
        </div>

      </section>

      <!-- Illustration Area -->
      <div class="illustration-area">
        <img src="maternal_line_art_reminders_1777742556313.png" alt="Maternal Illustration" class="maternal-art">
      </div>

    </main>

    <!-- Add Reminder Modal -->
    <div id="add-reminder-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <h3 class="modal-title">New Reminder</h3>
        <div class="modal-input-group">
          <label class="modal-label">LABEL</label>
          <input type="text" id="new-reminder-title" class="modal-input" placeholder="e.g. Vitamins">
        </div>
        <div class="modal-input-group">
          <label class="modal-label">TIME</label>
          <input type="time" id="new-reminder-time" class="modal-input">
        </div>
        <div class="modal-actions">
          <button id="btn-cancel-reminder" class="modal-btn-cancel">Cancel</button>
          <button id="btn-save-reminder" class="modal-btn-save">Save</button>
        </div>
      </div>
    </div>

  </div>

<script src='script.js'></script></body>
</html>
