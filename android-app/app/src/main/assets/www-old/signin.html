<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Sign In</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-skeuomorphic.css">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="stylesheet" href="mobile-patch.css">
  <link rel="stylesheet" href="figma-theme.css">
</head>
<body class="signin-body">

  <div class="signin-screen">
    
    <!-- Branding Header -->
    <div class="branding-header">
      <h1 class="heading">Welcome back</h1>
      <p class="subtitle">Continue your wellness journey with us.</p>
    </div>

    <!-- Sign In Card with Glass Effect -->
    <div class="sign-in-card">
      
      <!-- Tab Switcher -->
      <div class="tab-switcher">
        <button class="tab active">Email</button>
        <button class="tab">Phone</button>
      </div>

      <!-- Form Fields -->
      <form class="form-fields">
        
        <!-- Email Field -->
        <div class="form-group">
          <label class="field-label">Email Address</label>
          <div class="input-wrapper">
            <!-- Envelope Icon -->
            <svg class="input-icon left-icon" width="20" height="16" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 2C20 0.9 19.1 0 18 0H2C0.9 0 0 0.9 0 2V14C0 15.1 0.9 16 2 16H18C19.1 16 20 15.1 20 14V2ZM18 2L10 7L2 2H18ZM18 14H2V4L10 9L18 4V14Z" fill="#2D312D"/>
            </svg>
            <input type="email" placeholder="name@example.com" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="label-row">
            <label class="field-label">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <!-- Lock Icon -->
            <svg class="input-icon left-icon" width="16" height="21" viewBox="0 0 16 21" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 7H13V5C13 2.24 10.76 0 8 0C5.24 0 3 2.24 3 5V7H2C0.9 7 0 7.9 0 9V19C0 20.1 0.9 21 2 21H14C15.1 21 16 20.1 16 19V9C16 7.9 15.1 7 14 7ZM5 5C5 3.34 6.34 2 8 2C9.66 2 11 3.34 11 5V7H5V5ZM14 19H2V9H14V19ZM8 16C9.1 16 10 15.1 10 14C10 12.9 9.1 12 8 12C6.9 12 6 12.9 6 14C6 15.1 6.9 16 8 16Z" fill="#2D312D"/>
            </svg>
            <input type="password" placeholder="••••••••" required>
            <!-- Eye Icon -->
            <svg class="input-icon right-icon" width="22" height="15" viewBox="0 0 22 15" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11 0.5C6 0.5 1.73 3.61 0 8C1.73 12.39 6 15.5 11 15.5C16 15.5 20.27 12.39 22 8C20.27 3.61 16 0.5 11 0.5ZM11 12.5C8.52 12.5 6.5 10.48 6.5 8C6.5 5.52 8.52 3.5 11 3.5C13.48 3.5 15.5 5.52 15.5 8C15.5 10.48 13.48 12.5 11 12.5ZM11 5.5C9.62 5.5 8.5 6.62 8.5 8C8.5 9.38 9.62 10.5 11 10.5C12.38 10.5 13.5 9.38 13.5 8C13.5 6.62 12.38 5.5 11 5.5Z" fill="#2D312D"/>
            </svg>
          </div>
        </div>

        <!-- Primary Action Button -->
        <button type="submit" class="btn-signin" onclick="event.preventDefault(); location.href='dashboard.html'">Sign In</button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Social Sign-in -->
      <div class="social-buttons">
        <button class="btn-social google-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <button class="btn-social apple-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16.365 7.043c.806-1.002 1.348-2.392 1.2-3.778-1.186.05-2.658.82-3.483 1.817-.734.888-1.373 2.308-1.196 3.66 1.32.103 2.673-.697 3.479-1.7zm-1.135 1.488c-1.897-.042-3.535 1.18-4.439 1.18-.934 0-2.3-.996-3.83-1.006-1.986-.025-3.82 1.186-4.846 3.023-2.08 3.737-.534 9.248 1.492 12.288.995 1.492 2.164 3.167 3.754 3.103 1.543-.065 2.128-1.026 4.004-1.026 1.86 0 2.404 1.026 4.025.992 1.653-.034 2.646-1.503 3.627-2.99 1.135-1.722 1.6-3.393 1.62-3.479-.036-.016-3.168-1.258-3.197-4.86-.024-3.003 2.378-4.472 2.493-4.545-1.423-2.148-3.666-2.433-4.46-2.485h-.002-2.241z" fill="#FFF"/></svg>
          Continue with Apple
        </button>
      </div>

    </div>
    
    <!-- Footer Link -->
    <div class="footer-link">
      <p class="new-here-text">New here? <a href="signup.html" class="create-account">Create account</a></p>
    </div>

  </div>

<script src='script.js'></script></body>
</html>
