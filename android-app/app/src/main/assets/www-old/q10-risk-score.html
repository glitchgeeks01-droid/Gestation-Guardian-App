<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestation Guardian - Questionnaire Q10</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-skeuomorphic.css">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="stylesheet" href="mobile-patch.css">
  <link rel="stylesheet" href="figma-theme.css">
</head>
<body class="q10-body">

  <div class="q-screen">
    <div class="q-bg-gradient"></div>
    <div class="q-bg-illustration"></div>

    <header class="q-header">
      <div class="q-top-bar">
        <button class="q-back-btn" onclick="location.href='q9-risk-score.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#436746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="q-title-group">
          <h1>Gestosis Risk Score</h1>
          <p>Assessing your preeclampsia risk level</p>
        </div>
      </div>

      <div class="q-progress-section">
        <span class="q-step-label">STEP 10 OF 12</span>
        <div class="q-progress-track">
          <div class="q-progress-fill" style="width: 83.33%;"></div>
        </div>
      </div>
    </header>

    <main class="q-main">
      <div class="q-card">
        <div class="q-card-header">
          <div class="q-badge">
            <span class="q-badge-text">Q10 OF 12</span>
            <div class="q-badge-line"></div>
          </div>
        </div>

        <h2 class="q-question">Are you experiencing any of these symptoms?</h2>

        <div class="q-choice-list">
          <label class="q-choice-item">
            <input type="checkbox" name="symptom" value="headache">
            <div class="q-choice-content">
              <div class="q-choice-checkbox"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">Severe persistent headache</span>
                <span class="q-choice-points">+2 pts clinical factor</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="checkbox" name="symptom" value="vision">
            <div class="q-choice-content">
              <div class="q-choice-checkbox"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">Blurred or flashing vision</span>
                <span class="q-choice-points">+2 pts clinical factor</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="checkbox" name="symptom" value="pain">
            <div class="q-choice-content">
              <div class="q-choice-checkbox"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">Upper abdominal pain</span>
                <span class="q-choice-points">+2 pts clinical factor</span>
              </div>
            </div>
          </label>

          <label class="q-choice-item">
            <input type="checkbox" name="symptom" value="swelling">
            <div class="q-choice-content">
              <div class="q-choice-checkbox"></div>
              <div class="q-choice-text">
                <span class="q-choice-title">Sudden swelling (Face/Hands)</span>
                <span class="q-choice-points">+1 pt clinical factor</span>
              </div>
            </div>
          </label>
        </div>

        <div class="q-helper-box" style="background:rgba(186,26,26,0.05); border-color:rgba(186,26,26,0.1);">
          <div class="icon"></div>
          <p style="color:#601410;">Contact your healthcare provider or go to a hospital immediately if severe symptoms persist.</p>
        </div>
      </div>

      <div class="q-actions">
        <button id="q10-next-btn" class="q-btn-primary" onclick="location.href='q11-risk-score.html'">Next</button>
        <button class="q-btn-secondary" onclick="location.href='dashboard.html'">Save and Exit</button>
      </div>
    </main>
  </div>

<script src='script.js'></script></body>
</html>
